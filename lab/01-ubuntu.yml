---
- name: Apply the first Ubuntu configuration
  hosts: linux
  become: true
  gather_facts: true
  vars_files:
    - vars/lab.yml
  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Publish the lab identification file
      ansible.builtin.copy:
        dest: /var/www/html/ansible-lab.txt
        owner: root
        group: root
        mode: "0644"
        content: |
          Environment: {{ lab_environment }}
          Message: {{ lab_message }}

    - name: Ensure Nginx is running and enabled at boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

